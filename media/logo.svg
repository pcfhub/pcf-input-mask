<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A field with a pattern in it: two slots typed, a literal between, two
       slots still waiting.

       The silhouette is the field itself, wide and low, where the catalogue's
       other marks are squares and circles; what sits in it is the mask, which
       is the whole control. Filled slots are blocks, empty ones are the
       underscores of the guide the control draws in an empty field, and the
       dash between them is a literal the user never types.

       The ramp is the PCFHub mark's own, verbatim, declared userSpaceOnUse
       across the whole canvas so the mark reads as one object lit from the
       top right.

       Drawn for 32px: every part is at least 6 units on its short side except
       the dash (5) and the underscores (6), the thinnest that still left
       a line at 24px.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="input-mask-ramp" x1="14" y1="82" x2="84" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>

  <!-- The field. -->
  <rect x="6" y="24" width="84" height="48" rx="14" fill="url(#input-mask-ramp)"/>

  <!-- Two slots typed. -->
  <rect x="17" y="36" width="11" height="24" rx="4" fill="#F8FAFC"/>
  <rect x="32" y="36" width="11" height="24" rx="4" fill="#F8FAFC"/>

  <!-- The literal. -->
  <rect x="47" y="45.5" width="6" height="5" rx="2.5" fill="#F8FAFC"/>

  <!-- Two slots waiting. -->
  <rect x="57" y="54" width="9" height="6" rx="3" fill="#F8FAFC"/>
  <rect x="70" y="54" width="9" height="6" rx="3" fill="#F8FAFC"/>
</svg>
